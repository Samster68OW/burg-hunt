<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zero Nation Yearbook</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <!-- Internal Javascript -->
      <!-- Scripts -->
        <script type="text/javascript" src="sound-engine.js"></script>
    <!-- Internal CSS -->
        <link rel="stylesheet" href="stylesheets/main.css">

  </head>
  <body><center>



    <div id="main-heading">Zero Nation Yearbook</div>
    <div id="game-frame">
      <div id="page-display"></div>
      <div id='turn-left' class="turn-page-button" onclick="turnLeft();" hidden></div>
      <div id='turn-right' class="turn-page-button" onclick="turnRight();" hidden></div>
      <div id='open-right' class="turn-page-button" onclick="turnRight();" hidden></div>
      <div id='hover-secret' class="turn-page-button" onmouseenter="revealSecret();" onmouseleave="hideSecret();" hidden></div>
      <div id='hover-secret-two' class="turn-page-button" onmouseenter="revealSecret();" onmouseleave="hideSecret();" hidden></div>
    </div>
    Click on the page corners to flip through the book.



    <!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
    <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha384-nvAa0+6Qg9clwYCGGPpDQLVpLNn0fRaROjHqs13t4Ggj3Ez50XnGQqc/r8MhnRDZ" crossorigin="anonymous"></script>
    <!-- Include all compiled plugins (below), or include individual files as needed -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js" integrity="sha384-aJ21OjlMXNL5UyIl/XNwTMqvzeRMZH2w8c5cRVpzpU8Y5bApTppSuUkhZXN0VxHd" crossorigin="anonymous"></script>
    <script type="text/javascript">



let musicStarted = false;
$(document).ready(function(){
  initialLoad();
  displayPage();
});



const totalPages = 21;
const lastPageWithSecret = 17;



function initialLoad() {
  let display = ``;
  for (let i=0; i<totalPages; i++) {
    display += `<img id='page_${i}_img' src='images/pages/page_${i}.png' style='display:none;'>`;
    if (i >= 2 && i <= lastPageWithSecret | i === 19) display += `<img id='page_${i}s_img' src='images/pages/page_${i}s.png' style='display:none;'>`;
  }
  $('#page-display').html(display);
};



let yearbookPage = 0;
function displayPage() {
  $(`#page_${yearbookPage}_img`).fadeIn(0);
  // Default buttons
    $('#turn-left').fadeIn(0);
    $('#turn-right').fadeIn(0);
    $('#open-right').fadeOut(0);
    $('#hover-secret').fadeOut(0);
    $('#hover-secret-two').fadeOut(0);
  // Adjust buttons
    if (yearbookPage === 0) {
      $('#turn-left').fadeOut(0);
      $('#turn-right').fadeOut(0);
      $('#open-right').fadeIn(0);
    }
    if (yearbookPage === totalPages-1) $('#turn-right').fadeOut(0);
    if (yearbookPage >= 2 && yearbookPage <= lastPageWithSecret) $('#hover-secret').fadeIn(0);
    if (yearbookPage === 19) $('#hover-secret-two').fadeIn(0);
};
function turnLeft() {
  $(`#page_${yearbookPage}_img`).fadeOut(0);
  yearbookPage--;
  if (yearbookPage < 0) yearbookPage = 0;
  displayPage();
  playFlipSound();
};
function turnRight() {
  $(`#page_${yearbookPage}_img`).fadeOut(0);
  yearbookPage++;
  if (yearbookPage >= totalPages) yearbookPage = totalPages - 1;
  displayPage();
  playFlipSound();
  playMusic();
};



function revealSecret() {
  $(`#page_${yearbookPage}_img`).fadeOut(0);
  $(`#page_${yearbookPage}s_img`).fadeIn(0);
  playSound("Secret Found");
};
function hideSecret() {
  $(`#page_${yearbookPage}_img`).fadeIn(0);
  $(`#page_${yearbookPage}s_img`).fadeOut(0);
};



let currentSound = 0;
function playFlipSound() {
  currentSound++;
  if (currentSound === 4) currentSound = 1;
  loadSounds();
  playSound(`Flip ${currentSound}`);
};
function playMusic() {
  if (musicStarted === true) return;
  musicStarted = true;
  playSound('Box Dim 3');
}



    </script>
  </center></body>
</html>
