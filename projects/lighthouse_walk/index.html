<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Walk to the Lighthouse</title>
    <!--<link rel="icon" type="image/x-icon" href="images/favicon.ico">-->

    <!-- External Sources -->
      <link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Text:wght@200..700&display=swap" rel="stylesheet">
    <!-- Internal Javascript -->
     <!-- Data -->
      <script type="text/javascript" src="data/ghost-data.js"></script>
      <script type="text/javascript" src="data/level-data.js"></script>
     <!-- Scripts -->
      <script type="text/javascript" src="scripts/game-code.js"></script>
      <script type="text/javascript" src="scripts/save-player.js"></script>
      <script type="text/javascript" src="scripts/sound-engine.js"></script>
    <!-- Stylesheets -->
      <link href="stylesheets/main.css" rel="stylesheet">

  </head>
  <body>



    <div id="game-frame">
      <div id="main-menu-screen" class="main-div" hidden>
        <img id="main-menu-surferbro" src="images/surferbro.png" hidden>
        <div id="main-menu-container">
          <div id="main-menu-title">Walk to the<br>Lighthouse</div>
          <span style="position:absolute; text-align:center; top:550px; width:100%;">
            Made by Samster68.<br>
            This game is played with the mouse.
          </span>
          <span id="start-game-button" onclick="startGameButton();">Start Game</span>
        </div>
      </div>
      <div id="gameplay-screen" class="main-div" hidden>
        <div id="the-end-title" hidden>The End</div>
        <div id="the-end-title-two" hidden>
          <img src="images/samster.png"><br><br>
          Happy Halloween from Samster68!
        </div>
        <div id="vignette-box"></div>
        <div id="black-box"></div>
        <img id="surferbro-img" src="images/surferbro.png" hidden>
        <div id="gameplay-content"></div>
        <div id="dialogue-box" onclick="clickDialogueBox();" hidden></div>
      </div>
    </div>



    <script src="https://code.jquery.com/jquery-1.12.4.min.js" integrity="sha384-nvAa0+6Qg9clwYCGGPpDQLVpLNn0fRaROjHqs13t4Ggj3Ez50XnGQqc/r8MhnRDZ" crossorigin="anonymous"></script>
    <script type="text/javascript">



// Load launch screen once the document is fully loaded.
$(document).ready(function(){
  loadArea('main-menu');
});
function loadArea(name, fadeIn) {
  $('.main-div').fadeOut(0);
  if (fadeIn === true) $(`#${name}-screen`).fadeIn(2000);
  else $(`#${name}-screen`).fadeIn(0);
  // Main Menu
    if (playerDataLH.completedGame === 0) $('#main-menu-surferbro').fadeOut(0);
    else if (playerDataLH.completedGame === 1) $('#main-menu-surferbro').fadeIn(0);
};



    </script>
  </body>
</html>
