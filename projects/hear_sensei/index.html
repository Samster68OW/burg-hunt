    <script type="text/javascript">



$(document).ready(function(){
  shuffle(quoteList);
});
function shuffle(array) {
  let currentIndex = array.length;

  // While there remain elements to shuffle...
  while (currentIndex != 0) {

    // Pick a remaining element...
    let randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;

    // And swap it with the current element.
    [array[currentIndex], array[randomIndex]] = [
      array[randomIndex], array[currentIndex]];
  }
}
let currentQuote = -1;



function receiveWisdom() {

  // Set Text
    currentQuote++;
    if (currentQuote >= quoteList.length) currentQuote = 0;
    $('#sensei-text-box').html(`${quoteList[currentQuote]}<div id="ok-button" onclick="returnToMenu();">OK</div>`);

  $('#main-menu').fadeOut(2000);
  setTimeout(function() {
    $('#sensei-text-box').fadeIn(1000);
  },3000);

};

function returnToMenu() {
  $('#main-menu').fadeIn(0);
  $('#sensei-text-box').fadeOut(0);
};



let quoteList = [
  `young grasshopper,<br>if you miss your flight, there is a secret flight you can access by harassing minimum-wage flight attendants`,
  `young grasshopper,<br>i'm from the irs. where's rockhopper`,

  `I miss my wife, grasshopper.<br>I miss her a lot. I'll be back.`,
  `young grasshopper,<br>remember to use code KBLADEHERO in the fortnite shop.`,
  `In the FNAF4 minigame, why is tiny toy Chica missing her beak?`,
  `Joven saltamontes, este es un texto en español?`
];
